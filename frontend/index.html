<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />

    <title>FURY — Proteção autônoma para suas campanhas de tráfego pago</title>
    <meta
      name="description"
      content="FURY vigia seus anúncios 24/7 e age em segundos quando algo ameaça seu ROAS. Pare de descobrir o problema horas depois — pare de apagar incêndio."
    />
    <meta name="author" content="FURY" />
    <meta name="keywords" content="meta ads, tráfego pago, automação ads, brand safety, monitoramento anúncios, compliance ads, gestor de tráfego" />
    <link rel="canonical" href="https://fury.dev/" />

    <!-- Icons -->
    <link rel="icon" type="image/webp" href="/icon.webp" />
    <link rel="apple-touch-icon" href="/icon.webp" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FURY" />
    <meta property="og:title" content="FURY — Suas campanhas vivem do fogo. FURY não deixa apagar." />
    <meta
      property="og:description"
      content="Vigia seus anúncios 24/7. Age em segundos. Você dorme tranquilo, sua conta não corre risco. Conecte Meta, Google ou TikTok em 5 minutos."
    />
    <meta property="og:image" content="/icon.webp" />
    <meta property="og:image:alt" content="Logo FURY" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://fury.dev/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FURY — Proteção autônoma de tráfego pago" />
    <meta
      name="twitter:description"
      content="Anúncio bom não cai por acaso. Cai porque ninguém estava olhando. FURY é a vigia incansável. Detecta, classifica e age — em segundos."
    />
    <meta name="twitter:image" content="/icon.webp" />

    <!-- Performance: preconnect to font CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />

    <!-- Headline + body fonts (Fontshare — free commercial-grade) -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600,500&f[]=satoshi@400,500,700,900&display=swap"
    />
    <!-- Mono (JetBrains via Google) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <!-- Preload critical above-the-fold assets. NÃO preloadar o modelo 3D
         aqui — ele só é usado em seções abaixo do fold (R3F lazy-loaded) e
         o preload gerava warning do Chrome "preloaded but not used within
         a few seconds". O dynamic import do R3F já cuida do load on-demand. -->
    <link rel="preload" as="video" href="/background1dark.loop.mp4" type="video/mp4" />
    <link rel="preload" as="image" href="/icon.webp" type="image/webp" />

    <!-- JSON-LD: SoftwareApplication schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FURY",
        "description": "Sistema autônomo de proteção para tráfego pago. Vigia anúncios 24/7 e executa ações de correção em segundos para preservar performance e contas.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "ratingCount": "842",
          "bestRating": "5"
        },
        "offers": {
          "@type": "Offer",
          "availability": "https://schema.org/PreOrder",
          "priceCurrency": "BRL"
        },
        "creator": {
          "@type": "Organization",
          "name": "FURY",
          "url": "https://fury.dev/"
        }
      }
    </script>
  </head>
  <body>
    <a href="#main" class="visually-hidden-focusable">Pular para o conteúdo</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <style>
      .visually-hidden-focusable {
        position: absolute;
        left: -9999px;
        top: 0;
        background: #ff3d2e;
        color: white;
        padding: 10px 16px;
        z-index: 9999;
        border-radius: 0 0 8px 0;
      }
      .visually-hidden-focusable:focus { left: 0; }
    </style>
  </body>
</html>
